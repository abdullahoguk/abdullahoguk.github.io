# ─────────────────────────────────────────────────────────────
#  Projeler — /projects ve JSON-LD
#    id        url-dostu kimlik (#anchor ve detay sayfası adresi)
#    title     ad
#    year      "2024" veya "2022–"
#    status    active | wip | archived   (wip → "geliştiriliyor", archived → "eski işler")
#    kind      dev | design | music | photo
#    role      senin rolün
#    summary   { tr, en }
#    url       canlı link
#    repo      kaynak kodu
#    links     ek linkler [{label, url}]
#    stack     teknolojiler / araçlar
#    image     kapak görseli (opsiyonel, /img/... yolu)
#    featured  true → ana sayfada da listelenir
#    schema    WebSite | SoftwareApplication | CreativeWork
#  Detay sayfası: src/projects/<id>.md dosyası varsa /projects/<id>/ oluşur.
# ─────────────────────────────────────────────────────────────
