# ─────────────────────────────────────────────────────────────
#  Site & kimlik ayarları — identity settings
#  Bu dosya: meta etiketleri, JSON-LD (Person), llms.txt ve
#  ana sayfadaki tanıtım metnini besler.
#
#  İki dilli alanlar:  { tr: "Türkçe", en: "English" }
#  → Türkçe üstte, İngilizce altında daha küçük ve soluk görünür.
#  Düz metin de yazabilirsin; o zaman tek satır çıkar.
# ─────────────────────────────────────────────────────────────
url: https://abdullahoguk.com.tr
lang: tr-TR
title: Abdullah Öğük
# ana sayfanın <title>'ı ve paylaşım başlığı
homeTitle: "Abdullah Öğük · web yazılım geliştirici, tasarım ve fotoğraf"
description: >-
  Abdullah Öğük — Düzce'de web yazılım geliştirici (web developer). Musiki, makılî ve
  tipografi, arayüz tasarımı, fotoğraf; Alaturka Vakitler ve Radio TR gibi projeler.
  Web developer from Türkiye: classical music, type, design and photography.
locale: tr_TR
themeColor: "#1b1a18"
ogImage: /img/og.png
analyticsId: G-QL56TJ34G1   # boş bırakırsan GA yüklenmez

# ─────────────────────────────────────────────────────────────
#  Ana sayfa arka plan animasyonu (panelden de seçilebilir)
#    auto | steppe | spring | summer | autumn | winter | sunset
#    sunset → istanbul sahilinde gün batımı
#  auto → mevsime göre. Önizleme: siteye ?scene=winter ekle.
#  scenePicker: true → ana sayfada küçük bir sahne değiştirici çıkar
# ─────────────────────────────────────────────────────────────
scene: auto
scenePicker: true

author:
  name: Abdullah Öğük
  givenName: Abdullah
  familyName: Öğük
  alternateName: [Abdullah Oguk, abdullahoguk]
  email: merhaba@abdullahog.uk
  image: /img/avatar-logo.png       # TODO: gerçek portre fotoğrafı (kare, ≥400px)
  jobTitle: Web Developer
  jobTitleTr: Web Yazılım Geliştirici
  location: { city: Düzce, country: TR }
  worksFor:
    - { name: Serbay, url: "" }
    - { name: Kod8, url: "" }
  alumniOf:
    - name: Manisa Celal Bayar Üniversitesi
      url: https://www.cbu.edu.tr
  knowsAbout:
    - Web development
    - JavaScript
    - Frontend engineering
    - Progressive web apps
    - UI design
    - Typography
    - Square Kufic (makılî)
    - Graphic design
    - Photography
    - Turkish classical music
    - Tasavvuf musikisi
  languages: [tr, en]

# Ana sayfa tanıtım paragrafları (inline HTML serbest)
intro:
  - tr: "Merhaba, ben Abdullah."
    en: "Hi, I'm Abdullah."
  - tr: "Web yazılım geliştiriciyim. Kalan zamanlarda fotoğraf çeker, tasarım yapar, kitap okur, bisiklete binerim. Arada doğa gezisi ve kediler..."
    en: "Web developer. Otherwise designing, taking photos, reading and cycling. I wander in nature and love cats."

# "şimdi · now" — nerede çalışıyorsun, neyle uğraşıyorsun (satır başına bir cümle)
now:
  - tr: "Düzce'de Serbay ve Kod8'de web developer olarak çalışıyorum."
    en: "Web developer at Serbay and Kod8, Düzce."

