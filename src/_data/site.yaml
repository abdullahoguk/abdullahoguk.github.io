# ─────────────────────────────────────────────────────────────
#  Linkler — ana sayfada her grup kendi başlığı ve kısa cümlesiyle
#  bir bölüm olur.
#    id      dev | design | photo | other   (sabit)
#    title   { tr, en }
#    blurb   { tr, en } — "ne yapıyorum" cümlesi (inline HTML serbest)
#    items   linkler; primary: true → giriş altında da gösterilir
#  Tümü JSON-LD sameAs olur (sameAs: false ile hariç tut).
# ─────────────────────────────────────────────────────────────
links:
