blurb:
  tr: En çok klasik Türk musikisi dinlerim; makamlardan en sevdiklerim acemaşiran ve nihavend. Batı müziğinin ve başka kültürlerin klasik eserlerini de severim. Bunların yanında tekke musikisi, soul, blues, caz ve Doğu’dan, Batı’dan şarkılar dinlerim; arada da İsmet Özel’in sesinden şiirler.
  en: Mostly Turkish classical music, acemaşiran and nihavend above all, along with Western and other classical traditions. Also Sufi hymns, soul, blues, jazz, songs from East and West, and some poetry.
