blurb:
  tr: Klasik olan her şeyi severim; Türk ya da Batı fark etmez. Makamlardan en çok acemaşiran ve nihavend. Yanında tekke musikisi, soul, blues ve caz, Doğu’dan ve Batı’dan şarkılar; arada da İsmet Özel’in sesinden şiirler.
  en: Anything classical, Turkish or Western, acemaşiran and nihavend above all. Plus Sufi hymns, soul, blues, jazz, songs from East and West, and some poetry.
